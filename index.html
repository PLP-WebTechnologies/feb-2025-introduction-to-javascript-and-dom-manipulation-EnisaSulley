<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>JavaScript DOM Manipulation</h1>
    </header>
    
    <section>
        <h2>Manipulate Text and Style</h2>
        <p id="text">This is a paragraph that will change dynamically.</p>
        <button id="changeTextButton">Change Text</button>
    </section>

    <section>
        <h2>Modify Style</h2>
        <p id="styledParagraph">This paragraph's style can be modified via JavaScript.</p>
        <button id="changeStyleButton">Change Style</button>
    </section>

    <section>
        <h2>Add or Remove Element</h2>
        <div id="container">
            <button id="toggleButton">Add or Remove Element</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
